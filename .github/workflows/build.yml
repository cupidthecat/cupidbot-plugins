name: Build and Publish Plugins (main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for release creation and gh-pages push

    env:
      CI: true
      PLUGINS_RELEASE_TAG: latest-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout CupidBot client
        uses: actions/checkout@v4
        with:
          repository: cupidthecat/cupidbot
          ref: main
          path: cupidbot-client

      - name: Set up JDK 17 for CupidBot
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build CupidBot client JAR
        run: |
          chmod +x cupidbot-client/gradlew
          ./cupidbot-client/gradlew -p cupidbot-client :client:shadowJar

          CLIENT_JAR=$(find "$GITHUB_WORKSPACE/cupidbot-client/runelite-client/build/libs" -maxdepth 1 -type f -name 'client-*-shaded.jar' -print -quit)
          if [ -z "$CLIENT_JAR" ]; then
            echo "CupidBot shaded client JAR was not produced" >&2
            exit 1
          fi
          echo "CUPIDBOT_CLIENT_JAR=$CLIENT_JAR" >> "$GITHUB_ENV"

      - name: Set up JDK 11 for plugins
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permissions
        run: chmod +x gradlew

      - name: Build JARs
        run: ./gradlew clean build -PpluginsReleaseTag=${{ env.PLUGINS_RELEASE_TAG }} -PcupidbotClientPath="$CUPIDBOT_CLIENT_JAR"

      - name: Generate plugin documentation
        run: ./gradlew copyPluginDocs -PpluginsReleaseTag=${{ env.PLUGINS_RELEASE_TAG }} -PcupidbotClientPath="$CUPIDBOT_CLIENT_JAR"

      - name: Generate plugins.json
        run: ./gradlew generatePluginsJson -PpluginsReleaseTag=${{ env.PLUGINS_RELEASE_TAG }} -PcupidbotClientPath="$CUPIDBOT_CLIENT_JAR"

      - name: Create/Update GitHub Release with JARs (latest-release)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.PLUGINS_RELEASE_TAG }}
          name: Latest build (${{ env.PLUGINS_RELEASE_TAG }})
          body: "Commit: ${{ github.sha }}"
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "**/build/libs/*.jar"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          allow_empty_commit: true
